name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm test
      # deterministic + graph benchmark — free/offline; exit 2 means label/engine mismatch.
      # The semantic slice needs an API key and is run manually, not in CI.
      - run: pnpm bench -- --graph
      - run: node apps/cli/dist/index.js compile
      - run: node apps/cli/dist/index.js doctor
