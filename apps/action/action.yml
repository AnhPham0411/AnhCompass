name: "AnhCompass Drift Check"
description: "Detect architectural drift using intent-based rules"
author: "AnhCompass"

inputs:
  anthropic-api-key:
    description: "Anthropic API key for semantic checks (optional — deterministic-only if absent)"
    required: false
    default: ""
  intent-dir:
    description: "Path to intent directory"
    required: false
    default: ".agent/intent"
  diff-ref:
    description: "Git ref to diff against"
    required: false
    default: "origin/main"
  fail-on:
    description: "When to fail the job: block (deterministic violations only — default), any (all violations, including LLM warn-level), never"
    required: false
    default: "block"
  github-token:
    description: "GitHub token for PR comments"
    required: false
    default: ${{ github.token }}

outputs:
  violations:
    description: "Total number of violations found"
    value: ${{ steps.check.outputs.violations }}
  blocking-violations:
    description: "Violations with deterministic evidence (enforcement: block)"
    value: ${{ steps.check.outputs.blocking-violations }}
  warnings:
    description: "Warn-level violations (LLM semantic or severity warn)"
    value: ${{ steps.check.outputs.warnings }}
  report:
    description: "Markdown report"
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Run drift check
      id: check
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # composite actions do not auto-expose inputs — map them explicitly
        # to the INPUT_* names @actions/core getInput() reads
        INPUT_INTENT-DIR: ${{ inputs.intent-dir }}
        INPUT_DIFF-REF: ${{ inputs.diff-ref }}
        INPUT_FAIL-ON: ${{ inputs.fail-on }}
      run: node ${{ github.action_path }}/dist/comment.js
